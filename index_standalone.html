    const INITIAL_TEAMS = [

      { id: 'team-2', tournamentId: 't-1', name: 'Lê Đức Phát', club: 'Quân Đội', seed: 2, avatar: '⚡' },

      { id: 'team-5', tournamentId: 't-1', name: 'Trần Quốc Khánh', club: 'Hà Nội', seed: null, avatar: '🎯' },
      { id: 'team-6', tournamentId: 't-1', name: 'Phạm Hồng Nam', club: 'Hà Nội', seed: null, avatar: '🚀' },
      { id: 'team-7', tournamentId: 't-1', name: 'Đỗ Tuấn Đức', club: 'Hải Phòng', seed: null, avatar: '💥' },
      { id: 'team-8', tournamentId: 't-1', name: 'Bùi Bằng Đức', club: 'Quân Đội', seed: null, avatar: '🛡️' },

      // Teams for t-3
      { id: 'team-301', tournamentId: 't-3', name: 'Nguyễn Thùy Linh (Trẻ)', club: 'Đồng Nai', seed: 1, avatar: '🥇' },
      { id: 'team-302', tournamentId: 't-3', name: 'Vũ Thị Anh Thư', club: 'TP.HCM', seed: 2, avatar: '🥈' },
      { id: 'team-303', tournamentId: 't-3', name: 'Lê Ngọc Vân', club: 'Hà Nội', seed: 3, avatar: '🥉' },
      { id: 'team-304', tournamentId: 't-3', name: 'Bùi Bích Phương', club: 'Bắc Giang', seed: 4, avatar: '🏅' },
    ];

    const INITIAL_MATCHES = [
      // Tournament t-1 (8-team Bracket)
      {
        id: 'm-101', tournamentId: 't-1', roundNumber: 1, matchOrder: 1, roundName: 'Tứ Kết 1',
        team1Id: 'team-1', team2Id: 'team-8', court: 'Sân 1', scheduledTime: '09:00', status: 'COMPLETED',
        winnerId: 'team-1', setScores: [{ setNumber: 1, team1Score: 21, team2Score: 14 }, { setNumber: 2, team1Score: 21, team2Score: 16 }],
        nextMatchId: 'm-105', nextMatchSlot: 1
      },
      {
        id: 'm-102', tournamentId: 't-1', roundNumber: 1, matchOrder: 2, roundName: 'Tứ Kết 2',
        team1Id: 'team-4', team2Id: 'team-5', court: 'Sân 2', scheduledTime: '10:00', status: 'COMPLETED',
        winnerId: 'team-4', setScores: [{ setNumber: 1, team1Score: 21, team2Score: 19 }, { setNumber: 2, team1Score: 18, team2Score: 21 }, { setNumber: 3, team1Score: 22, team2Score: 20 }],
        nextMatchId: 'm-105', nextMatchSlot: 2
      },
      {
        id: 'm-103', tournamentId: 't-1', roundNumber: 1, matchOrder: 3, roundName: 'Tứ Kết 3',
        team1Id: 'team-3', team2Id: 'team-6', court: 'Sân 1', scheduledTime: '11:00', status: 'COMPLETED',
        winnerId: 'team-3', setScores: [{ setNumber: 1, team1Score: 21, team2Score: 12 }, { setNumber: 2, team1Score: 21, team2Score: 15 }],
        nextMatchId: 'm-106', nextMatchSlot: 1
      },
      {
        id: 'm-104', tournamentId: 't-1', roundNumber: 1, matchOrder: 4, roundName: 'Tứ Kết 4',
        team1Id: 'team-7', team2Id: 'team-2', court: 'Sân 2', scheduledTime: '14:00', status: 'IN_PROGRESS',
        winnerId: null, setScores: [{ setNumber: 1, team1Score: 21, team2Score: 19 }, { setNumber: 2, team1Score: 15, team2Score: 21 }, { setNumber: 3, team1Score: 12, team2Score: 16 }],
        nextMatchId: 'm-106', nextMatchSlot: 2
      },
      // Semis
      {
        id: 'm-105', tournamentId: 't-1', roundNumber: 2, matchOrder: 1, roundName: 'Bán Kết 1',
        team1Id: 'team-1', team2Id: 'team-4', court: 'Sân Trung Tâm', scheduledTime: '09:00', status: 'SCHEDULED',
        winnerId: null, setScores: [{ setNumber: 1, team1Score: 0, team2Score: 0 }, { setNumber: 2, team1Score: 0, team2Score: 0 }],
        nextMatchId: 'm-107', nextMatchSlot: 1
      },
      {
        id: 'm-106', tournamentId: 't-1', roundNumber: 2, matchOrder: 2, roundName: 'Bán Kết 2',
        team1Id: 'team-3', team2Id: null, court: 'Sân Trung Tâm', scheduledTime: '10:30', status: 'SCHEDULED',
        winnerId: null, setScores: [{ setNumber: 1, team1Score: 0, team2Score: 0 }, { setNumber: 2, team1Score: 0, team2Score: 0 }],
        nextMatchId: 'm-107', nextMatchSlot: 2
      },
      // Finals
      {
        id: 'm-107', tournamentId: 't-1', roundNumber: 3, matchOrder: 1, roundName: 'Chung Kết',
        team1Id: null, team2Id: null, court: 'Sân Trung Tâm', scheduledTime: '15:00', status: 'SCHEDULED',
        winnerId: null, setScores: [{ setNumber: 1, team1Score: 0, team2Score: 0 }, { setNumber: 2, team1Score: 0, team2Score: 0 }],
        nextMatchId: null, nextMatchSlot: null
      }
    ];

    // --- APP COMPONENT ---
    function App() {
      const [tournaments, setTournaments] = useState(INITIAL_TOURNAMENTS);
      const [teams, setTeams] = useState(INITIAL_TEAMS);
      const [matches, setMatches] = useState(INITIAL_MATCHES);

      const [isAdmin, setIsAdmin] = useState(false);
      const [currentView, setCurrentView] = useState('home'); // 'home', 'detail', 'admin'
      const [selectedTournamentId, setSelectedTournamentId] = useState('t-1');
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [isScoreModalOpen, setIsScoreModalOpen] = useState(false);
      const [isCreateTournamentModalOpen, setIsCreateTournamentModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // BWF Score Validation & Auto-Advancing Winner
      const handleUpdateScore = (matchId, newSets) => {
        const match = matches.find(m => m.id === matchId);
        if (!match) return;

        const tournament = tournaments.find(t => t.id === match.tournamentId) || { maxSets: 3, pointsToWinSet: 21, maxPointsCap: 30 };
        const setsToWin = Math.ceil(tournament.maxSets / 2);

        let t1Wins = 0;
        let t2Wins = 0;

        const validatedSets = newSets.map(s => {
          const s1 = Number(s.team1Score) || 0;
          const s2 = Number(s.team2Score) || 0;
          let winner = null;
          if (s1 >= tournament.maxPointsCap || (s1 >= tournament.pointsToWinSet && s1 - s2 >= 2)) winner = match.team1Id;
          else if (s2 >= tournament.maxPointsCap || (s2 >= tournament.pointsToWinSet && s2 - s1 >= 2)) winner = match.team2Id;

          if (winner === match.team1Id) t1Wins++;
          if (winner === match.team2Id) t2Wins++;

          return { setNumber: s.setNumber, team1Score: s1, team2Score: s2, winnerTeamId: winner };
        });

        const isMatchDone = t1Wins >= setsToWin || t2Wins >= setsToWin;
        const matchWinnerId = isMatchDone ? (t1Wins >= setsToWin ? match.team1Id : match.team2Id) : null;
        const newStatus = isMatchDone ? 'COMPLETED' : 'IN_PROGRESS';

        let updatedMatches = matches.map(m => {
          if (m.id === matchId) {
            return { ...m, setScores: validatedSets, winnerId: matchWinnerId, status: newStatus };
          }
          return m;
        });

        // AUTO ADVANCE WINNER TO NEXT ROUND
        if (isMatchDone && match.nextMatchId && match.nextMatchSlot) {
          updatedMatches = updatedMatches.map(m => {
            if (m.id === match.nextMatchId) {
              return {
                ...m,
                team1Id: match.nextMatchSlot === 1 ? matchWinnerId : m.team1Id,
                team2Id: match.nextMatchSlot === 2 ? matchWinnerId : m.team2Id,
              };
            }
            return m;
          });
        }

        setMatches(updatedMatches);
        setIsScoreModalOpen(false);
        const winTeam = teams.find(t => t.id === matchWinnerId);
        showToast(isMatchDone && winTeam ? `🏆 Đội "${winTeam.name}" đã thắng trận và tiến vào vòng sau!` : 'Đã cập nhật tỷ số thành công!');
      };

      const selectedTournament = tournaments.find(t => t.id === selectedTournamentId) || tournaments[0];
      const tournamentMatches = matches.filter(m => m.tournamentId === selectedTournament?.id);

      // Group matches by round for bracket
      const rounds = {};
      tournamentMatches.forEach(m => {
        if (!rounds[m.roundNumber]) rounds[m.roundNumber] = [];
        rounds[m.roundNumber].push({
          ...m,
          team1: teams.find(t => t.id === m.team1Id),
          team2: teams.find(t => t.id === m.team2Id),
        });
      });
      Object.keys(rounds).forEach(r => rounds[r].sort((a,b) => a.matchOrder - b.matchOrder));

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navigation */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 h-14 sm:h-16 flex items-center justify-between gap-2">
              <div onClick={() => setCurrentView('home')} className="flex items-center gap-2 sm:gap-3 cursor-pointer shrink min-w-0">
                <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-base sm:text-xl shadow-md shrink-0">
                  🏸
                </div>
                <div className="min-w-0 truncate">
                  <span className="font-extrabold text-sm sm:text-base text-slate-900 tracking-tight">HERMAN <span className="text-emerald-600">CLB</span></span>
                  <span className="hidden md:inline-block ml-1.5 text-[9px] uppercase font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">CLB Nội Bộ</span>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-3 shrink-0">
                <button
                  onClick={() => setCurrentView('home')}
                  className={`px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${currentView === 'home' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  Giải Đấu
                </button>
                {isAdmin && (
                  <button
                    onClick={() => setCurrentView('admin')}
                    className={`px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${currentView === 'admin' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    Quản Trị
                  </button>
                )}
                <button
                  onClick={() => {
                    const next = !isAdmin;
                    setIsAdmin(next);
                    if (next) setCurrentView('admin');
                    else if (currentView === 'admin') setCurrentView('home');
                  }}
                  className={`px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-xs font-bold border transition-all whitespace-nowrap ${
                    isAdmin ? 'bg-amber-50 text-amber-900 border-amber-300 ring-2 ring-amber-400/20' : 'bg-slate-100 text-slate-700 border-slate-200'
                  }`}
                >
                  {isAdmin ? '🛡️ Admin' : '👤 Khách'}
                </button>
              </div>
            </div>
          </header>

          {/* Main Views */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8">
            {/* VIEW 1: HOME PAGE */}
            {currentView === 'home' && (
              <div className="space-y-8">
                {/* Hero */}
                <div className="bg-gradient-to-r from-slate-950 via-emerald-950 to-slate-900 rounded-3xl p-8 md:p-12 text-white shadow-xl">
                  <span className="px-3 py-1 bg-emerald-500/20 text-emerald-300 text-xs font-bold uppercase rounded-full border border-emerald-500/30">
                    CLB Cầu Lông Hermann Badminton
                  </span>
                  <h1 className="text-3xl md:text-5xl font-black mt-3 mb-3">
                    Giải Đấu Nội Bộ <span className="text-emerald-400">Hermann Badminton Club</span>
                  </h1>
                  <p className="text-slate-300 text-sm max-w-xl mb-6">
                    Hệ thống theo dõi nhánh đấu, bốc thăm phân cặp và cập nhật kết quả thi đấu dành riêng cho các thành viên CLB Hermann Badminton.
                  </p>
                  {isAdmin && (
                    <button
                      onClick={() => setIsCreateTournamentModalOpen(true)}
                      className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg"
                    >
                      + Tạo Giải Đấu Mới
                    </button>
                  )}
                </div>

                {/* Tournament List Cards */}
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900 mb-4">Các Giải Đấu Tiêu Biểu</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {tournaments.map(t => (
                      <div
                        key={t.id}
                        onClick={() => { setSelectedTournamentId(t.id); setCurrentView('detail'); }}
                        className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg hover:border-emerald-500 transition-all cursor-pointer group"
                      >
                        <div className="relative h-44 bg-slate-800 overflow-hidden">
                          <img src={t.banner} alt={t.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" />
                          <div className="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-extrabold text-white bg-amber-500">
                            {t.status === 'ONGOING' ? 'LIVE ĐANG ĐẤU' : t.status === 'UPCOMING' ? 'SẮP DIỄN RA' : 'ĐÃ KẾT THÚC'}
                          </div>
                          <div className="absolute bottom-3 left-3 right-3 text-white">
                            <p className="text-xs text-emerald-300 font-bold">{t.category}</p>
                            <h3 className="font-bold text-base leading-snug truncate">{t.name}</h3>
                          </div>
                        </div>
                        <div className="p-4 text-xs space-y-2 text-slate-600">
                          <p>📍 {t.location}</p>
                          <p>📅 {t.startDate} ~ {t.endDate}</p>
                          <p>🏆 Giải thưởng: <strong className="text-emerald-700">{t.prizePool}</strong></p>
                          <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-emerald-700 font-bold">
                            <span>Xem Nhánh Đấu & Tỷ Số</span>
                            <span>→</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: TOURNAMENT DETAIL & BRACKET */}
            {currentView === 'detail' && selectedTournament && (
              <div className="space-y-6">
                <button
                  onClick={() => setCurrentView('home')}
                  className="px-3.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50"
                >
                  ← Quay lại Danh Sách Giải
                </button>

                {/* Banner */}
                <div className="bg-slate-900 text-white rounded-3xl p-6 md:p-8 shadow-xl flex flex-col justify-between">
                  <div className="flex gap-2 mb-2">
                    <span className="px-2.5 py-0.5 bg-amber-500 text-white rounded-full text-[10px] font-bold">
                      {selectedTournament.status}
                    </span>
                    <span className="px-2.5 py-0.5 bg-white/10 text-emerald-300 rounded-full text-[10px] font-bold">
                      {selectedTournament.category}
                    </span>
                  </div>
                  <h1 className="text-2xl md:text-3xl font-black">{selectedTournament.name}</h1>
                  <p className="text-xs text-slate-300 mt-2">📍 {selectedTournament.location} • 📅 {selectedTournament.startDate} đến {selectedTournament.endDate}</p>
                  <p className="text-xs text-emerald-400 font-bold mt-1">⚖️ Luật: Best of {selectedTournament.maxSets || 3} Set (21 Điểm, Kịch trần {selectedTournament.maxPointsCap || 30})</p>
                </div>

                {/* BRACKET TREE */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-4 sm:p-6">
                  <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 gap-2">
                    <div className="min-w-0">
                      <h3 className="font-bold text-sm sm:text-base text-slate-800 truncate">Sơ Đồ Nhánh Đấu (Bracket Tree)</h3>
                      <p className="text-[11px] sm:text-xs text-slate-400">Click vào thẻ trận đấu để {isAdmin ? 'chấm điểm (Admin)' : 'xem chi tiết hiệp đấu'}</p>
                    </div>
                    {isAdmin && (
                      <span className="px-2 py-0.5 bg-amber-100 text-amber-900 rounded-lg text-[10px] sm:text-xs font-bold shrink-0 whitespace-nowrap">
                        🛡️ Admin Chấm Điểm
                      </span>
                    )}
                  </div>

                  {/* Horizontal Scrollable Tree */}
                  <div className="overflow-x-auto custom-scrollbar pb-6 pt-2">
                    <div className="flex gap-10 min-w-max px-2">
                      {Object.keys(rounds).sort((a,b) => Number(a)-Number(b)).map((roundKey, rIdx) => {
                        const totalR = Object.keys(rounds).length;
                        const diff = totalR - rIdx;
                        const roundTitle = diff === 1 ? 'Chung Kết' : diff === 2 ? 'Bán Kết' : diff === 3 ? 'Tứ Kết' : `Vòng ${roundKey}`;

                        return (
                          <div key={roundKey} className="w-72 flex flex-col">
                            <div className="text-center mb-4">
                              <span className="px-3 py-1 bg-emerald-600 text-white rounded-full text-xs font-bold uppercase tracking-wider">
                                {roundTitle}
                              </span>
                            </div>

                            <div className="flex flex-col justify-around flex-1 gap-6">
                              {rounds[roundKey].map(m => {
                                const t1 = m.team1?.name || (m.team1Id ? `Đội #${m.team1Id}` : 'Chờ xác định');
                                const t2 = m.team2?.name || (m.team2Id ? `Đội #${m.team2Id}` : 'Chờ xác định');
                                const t1Win = m.status === 'COMPLETED' && m.winnerId === m.team1Id;
                                const t2Win = m.status === 'COMPLETED' && m.winnerId === m.team2Id;

                                return (
                                  <div
                                    key={m.id}
                                    onClick={() => {
                                      setSelectedMatch(m);
                                      setIsScoreModalOpen(true);
                                    }}
                                    className="bg-slate-50 border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:border-emerald-500 hover:shadow-md cursor-pointer transition-all"
                                  >
                                    <div className="px-3 py-1 bg-white border-b border-slate-200/80 flex items-center justify-between text-[11px] font-bold text-slate-500">
                                      <span>{m.roundName || `Trận #${m.matchOrder}`}</span>
                                      <span className={m.status === 'COMPLETED' ? 'text-slate-500' : m.status === 'IN_PROGRESS' ? 'text-amber-600 font-bold' : 'text-slate-400'}>
                                        {m.status === 'COMPLETED' ? 'Đã xong' : m.status === 'IN_PROGRESS' ? 'LIVE' : m.scheduledTime}
                                      </span>
                                    </div>

                                    {/* Team 1 */}
                                    <div className={`px-3 py-2 flex items-center justify-between text-xs border-b border-slate-100 ${t1Win ? 'bg-emerald-100/70 font-bold text-emerald-950' : 'text-slate-800'}`}>
                                      <span className="truncate">{m.team1?.avatar || '🏸'} {t1}</span>
                                      <div className="flex gap-1 font-mono text-[11px]">
                                        {m.setScores?.map((s, idx) => (
                                          <span key={idx} className={s.team1Score > s.team2Score ? 'font-bold text-emerald-700' : 'text-slate-400'}>
                                            {s.team1Score}
                                          </span>
                                        ))}
                                      </div>
                                    </div>

                                    {/* Team 2 */}
                                    <div className={`px-3 py-2 flex items-center justify-between text-xs ${t2Win ? 'bg-emerald-100/70 font-bold text-emerald-950' : 'text-slate-800'}`}>
                                      <span className="truncate">{m.team2?.avatar || '🏸'} {t2}</span>
                                      <div className="flex gap-1 font-mono text-[11px]">
                                        {m.setScores?.map((s, idx) => (
                                          <span key={idx} className={s.team2Score > s.team1Score ? 'font-bold text-emerald-700' : 'text-slate-400'}>
                                            {s.team2Score}
                                          </span>
                                        ))}
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: ADMIN DASHBOARD */}
            {currentView === 'admin' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 gap-3">
                  <div>
                    <h1 className="text-lg sm:text-xl font-bold text-slate-900">Bảng Điều Khiển Quản Trị CLB</h1>
                    <p className="text-xs text-slate-500">Quản lý các giải đấu nội bộ, cập nhật kết quả và sơ đồ nhánh</p>
                  </div>
                  <button
                    onClick={() => setIsCreateTournamentModalOpen(true)}
                    className="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow text-center"
                  >
                    + Thêm Giải Đấu
                  </button>
                </div>

                {/* Tournaments List/Table */}
                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                  {/* Mobile Card List */}
                  <div className="block lg:hidden divide-y divide-slate-100">
                    {tournaments.map(t => (
                      <div key={t.id} className="p-4 space-y-2.5">
                        <div className="flex items-start justify-between gap-2">
                          <h4 className="font-bold text-slate-900 text-sm">{t.name}</h4>
                          <span className="px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full text-[10px] font-bold shrink-0">{t.status}</span>
                        </div>
                        <p className="text-xs text-slate-500">📍 {t.location} • 📅 {t.startDate} ~ {t.endDate}</p>
                        <div className="pt-2 flex items-center justify-between">
                          <button
                            onClick={() => { setSelectedTournamentId(t.id); setCurrentView('detail'); }}
                            className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold shadow-sm"
                          >
                            Xem Nhánh & Chấm Điểm
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Desktop Table */}
                  <table className="w-full text-left text-xs hidden lg:table">
                    <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                      <tr>
                        <th className="p-4">Tên Giải Đấu</th>
                        <th className="p-4">Nội Dung</th>
                        <th className="p-4">Trạng Thái</th>
                        <th className="p-4">Địa Điểm</th>
                        <th className="p-4 text-right">Thao Tác</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {tournaments.map(t => (
                        <tr key={t.id} className="hover:bg-slate-50">
                          <td className="p-4 font-bold text-slate-900">{t.name}</td>
                          <td className="p-4">{t.category}</td>
                          <td className="p-4">
                            <span className="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-bold">{t.status}</span>
                          </td>
                          <td className="p-4 text-slate-500">{t.location}</td>
                          <td className="p-4 text-right space-x-2">
                            <button
                              onClick={() => { setSelectedTournamentId(t.id); setCurrentView('detail'); }}
                              className="px-3 py-1 bg-emerald-50 text-emerald-800 rounded font-bold hover:bg-emerald-100"
                            >
                              Xem Nhánh & Chấm Điểm
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* MODAL: SCORE EDITOR & DETAILS */}
          {isScoreModalOpen && selectedMatch && (
            <ScoreModal
              match={selectedMatch}
              isAdmin={isAdmin}
              tournament={selectedTournament}
              onClose={() => setIsScoreModalOpen(false)}
              onSave={handleUpdateScore}
            />
          )}

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold border border-slate-700 animate-bounce">
              {toast.msg}
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-center text-xs mt-auto">
            <p>© 2026 Hermann Badminton Club. Lưu hành nội bộ thành viên CLB 🏸</p>
          </footer>
        </div>
      );
    }

    // --- SCORE MODAL COMPONENT ---
    function ScoreModal({ match, isAdmin, tournament, onClose, onSave }) {
      const [sets, setSets] = useState(() => {
        if (match.setScores && match.setScores.length > 0) {
          return match.setScores.map(s => ({ setNumber: s.setNumber, team1Score: s.team1Score, team2Score: s.team2Score }));
        }
        return [
          { setNumber: 1, team1Score: 0, team2Score: 0 },
          { setNumber: 2, team1Score: 0, team2Score: 0 },
          { setNumber: 3, team1Score: 0, team2Score: 0 }
        ];
      });

      const team1Name = match.team1?.name || (match.team1Id ? `Đội #${match.team1Id}` : 'Chờ xác định');
      const team2Name = match.team2?.name || (match.team2Id ? `Đội #${match.team2Id}` : 'Chờ xác định');

      const handleScoreChange = (idx, team, val) => {
        const parsed = Math.max(0, Math.min(tournament?.maxPointsCap || 30, Number(val) || 0));
        const next = [...sets];
        next[idx][team] = parsed;
        setSets(next);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-slate-100">
            <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
              <h3 className="font-bold text-base">{isAdmin ? 'Cập Nhật Tỷ Số (Admin)' : 'Chi Tiết Trận Đấu'}</h3>
              <button onClick={onClose} className="text-xl font-bold text-slate-400 hover:text-white">&times;</button>
            </div>

            <div className="p-6 space-y-4">
              <div className="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border text-center text-xs">
                <div>
                  <span className="text-slate-400 font-bold uppercase">Đội 1</span>
                  <p className="font-bold text-slate-800 text-sm truncate">{team1Name}</p>
                </div>
                <div>
                  <span className="text-slate-400 font-bold uppercase">Đội 2</span>
                  <p className="font-bold text-slate-800 text-sm truncate">{team2Name}</p>
                </div>
              </div>

              {/* Sets Input */}
              <div className="space-y-2.5">
                {sets.map((set, idx) => (
                  <div key={set.setNumber} className="flex items-center justify-between p-2.5 bg-slate-50/70 rounded-xl border text-xs">
                    <span className="font-bold text-slate-700 w-14">Set {set.setNumber}</span>
                    <div className="flex items-center gap-3">
                      <input
                        type="number"
                        min="0"
                        max="30"
                        disabled={!isAdmin}
                        value={set.team1Score}
                        onChange={e => handleScoreChange(idx, 'team1Score', e.target.value)}
                        className="w-14 text-center py-1 font-mono font-bold text-sm bg-white border rounded-lg focus:ring-2 focus:ring-emerald-500 disabled:bg-slate-100"
                      />
                      <span className="font-bold text-slate-400">:</span>
                      <input
                        type="number"
                        min="0"
                        max="30"
                        disabled={!isAdmin}
                        value={set.team2Score}
                        onChange={e => handleScoreChange(idx, 'team2Score', e.target.value)}
                        className="w-14 text-center py-1 font-mono font-bold text-sm bg-white border rounded-lg focus:ring-2 focus:ring-emerald-500 disabled:bg-slate-100"
                      />
                    </div>
                  </div>
                ))}
              </div>

              {isAdmin && (
                <div className="p-2.5 bg-amber-50 rounded-lg text-[11px] text-amber-900 border border-amber-200">
                  ⚡ Khi đạt đủ 2 set thắng (21 điểm), đội thắng sẽ <strong>tự động được đẩy vào vòng tiếp theo</strong> trên sơ đồ nhánh đấu.
                </div>
              )}

              <div className="flex justify-end gap-2 pt-3 border-t">
                <button onClick={onClose} className="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg">
                  Đóng
                </button>
                {isAdmin && (
                  <button
                    onClick={() => onSave(match.id, sets)}
                    className="px-5 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow"
                  >
                    Lưu & Cập Nhật Nhánh
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
